<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategiegruppen – Addition &amp; Subtraktion</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f5f5f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem;
    color: #333;
  }
  h1 { margin-bottom: 0.3rem; font-size: 1.5rem; }
  h2 { margin: 2.5rem 0 1rem; font-size: 1.25rem; color: #555; }

  .grid-wrapper {
    display: flex;
    align-items: flex-end;
    gap: 0;
  }
  .y-label {
    writing-mode: vertical-lr;
    transform: rotate(180deg);
    font-weight: 600;
    font-size: 0.95rem;
    text-align: center;
    padding-right: 0.6rem;
  }
  .x-label {
    font-weight: 600;
    font-size: 0.95rem;
    text-align: center;
    margin-top: 0.5rem;
  }

  /* --- Addition grid (11×11) --- */
  .grid-add {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-template-rows: repeat(12, 1fr);
    gap: 2px;
  }

  /* --- Subtraction grid (21×21) --- */
  .grid-sub {
    display: grid;
    grid-template-columns: repeat(22, 1fr);
    grid-template-rows: repeat(22, 1fr);
    gap: 1px;
  }

  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 500;
    border-radius: 3px;
    color: #fff;
    text-shadow: 0 1px 1px rgba(0,0,0,0.25);
  }
  .grid-add .cell {
    width: 52px;
    height: 52px;
    font-size: 0.75rem;
    border-radius: 4px;
  }
  .grid-sub .cell {
    width: 32px;
    height: 32px;
    font-size: 0.55rem;
  }
  .cell.header {
    background: none;
    color: #555;
    font-weight: 700;
    text-shadow: none;
  }
  .grid-add .cell.header { font-size: 0.9rem; }
  .grid-sub .cell.header { font-size: 0.7rem; }
  .cell.corner { background: none; }
  .cell.empty  { background: none; }

  /* Addition strategy group colors */
  .g-identity  { background: #9e9e9e; }
  .g-plus1     { background: #78909c; }
  .g-doubles   { background: #e53935; }
  .g-near-dbl  { background: #fb8c00; }
  .g-making10  { background: #7cb342; }
  .g-count23   { background: #5c6bc0; }
  .g-bridge10  { background: #8e24aa; }

  /* Subtraction strategy group colors */
  .g-sub0      { background: #9e9e9e; }
  .g-sub-nn    { background: #607d8b; }
  .g-sub1      { background: #78909c; }
  .g-sub-half  { background: #e53935; }
  .g-sub-nhalf { background: #fb8c00; }
  .g-sub-from10{ background: #7cb342; }
  .g-sub-count { background: #5c6bc0; }
  .g-sub-in10  { background: #29b6f6; }
  .g-sub-thru10{ background: #8e24aa; }
  .g-sub-teen  { background: #ec407a; }

  .legend-table {
    margin-top: 1.5rem;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  .legend-table th {
    text-align: left;
    padding: 0.4rem 0.8rem;
    border-bottom: 2px solid #ccc;
    color: #555;
    font-weight: 600;
  }
  .legend-table td {
    padding: 0.35rem 0.8rem;
    border-bottom: 1px solid #e0e0e0;
  }
  .legend-table tr:last-child td {
    border-bottom: none;
  }
  .legend-table td:last-child {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .legend-swatch {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    display: inline-block;
    vertical-align: middle;
  }
  .subtitle {
    color: #888;
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
    font-style: italic;
  }
</style>
</head>
<body>

<!-- ============ ADDITION ============ -->
<h1>Strategiegruppen – Addition 0 bis 10</h1>
<p class="subtitle">Denk-Strategie, mit der das Kind die Aufgabe löst</p>

<div class="grid-wrapper">
  <div class="y-label">2. Summand</div>
  <div>
    <div class="grid-add" id="grid-add"></div>
    <div class="x-label">1. Summand</div>
  </div>
</div>

<table class="legend-table" id="legend-add"></table>

<!-- ============ SUBTRACTION ============ -->
<h2>Strategiegruppen – Subtraktion 0 bis 20</h2>
<p class="subtitle">Jede Aufgabe a − b wird über „Denke Addition: b + ? = a" gelöst</p>

<div class="grid-wrapper">
  <div class="y-label">Subtrahend (b)</div>
  <div>
    <div class="grid-sub" id="grid-sub"></div>
    <div class="x-label">Minuend (a)</div>
  </div>
</div>

<table class="legend-table" id="legend-sub"></table>

<script>
// ===================== ADDITION =====================

const addGroups = [
  { id: 'identity', label: '+0 (Identität)',        color: '#9e9e9e', phase: 1 },
  { id: 'plus1',    label: '+1',                     color: '#78909c', phase: 2 },
  { id: 'doubles',  label: 'Verdoppeln',             color: '#e53935', phase: 3 },
  { id: 'near-dbl', label: 'Fast-Verdoppeln (±1)',   color: '#fb8c00', phase: 4 },
  { id: 'making10', label: 'Zehner knacken (=10)',   color: '#7cb342', phase: 5 },
  { id: 'count23',  label: '+2 / +3 (Weiterzählen)', color: '#5c6bc0', phase: 6 },
  { id: 'bridge10', label: 'Über den Zehner (>10)',  color: '#8e24aa', phase: 7 },
];

function classifyAdd(a, b) {
  if (a === 0 || b === 0)    return 'identity';
  if (a === 1 || b === 1)    return 'plus1';
  if (a === b)               return 'doubles';
  if (Math.abs(a - b) === 1) return 'near-dbl';
  if (a + b === 10)          return 'making10';
  if (Math.min(a, b) <= 3)   return 'count23';
  if (a + b > 10)            return 'bridge10';
  return 'count23';
}

{
  const el = document.getElementById('grid-add');
  let html = '<div class="cell corner"></div>';
  for (let a = 0; a <= 10; a++) html += `<div class="cell header">${a}</div>`;
  for (let b = 10; b >= 0; b--) {
    html += `<div class="cell header">${b}</div>`;
    for (let a = 0; a <= 10; a++) {
      const g = classifyAdd(a, b);
      html += `<div class="cell g-${g}" title="${a}+${b}=${a+b}">${a}+${b}</div>`;
    }
  }
  el.innerHTML = html;
}

{
  const el = document.getElementById('legend-add');
  // Count facts per group
  const counts = {};
  for (const g of addGroups) counts[g.id] = 0;
  for (let a = 0; a <= 10; a++)
    for (let b = 0; b <= 10; b++)
      counts[classifyAdd(a, b)]++;
  const total = Object.values(counts).reduce((s, n) => s + n, 0);

  let html = '<thead><tr><th></th><th>Phase</th><th>Strategie</th><th>Anzahl</th></tr></thead><tbody>';
  for (const g of addGroups) {
    html += `<tr>
      <td><span class="legend-swatch" style="background:${g.color}"></span></td>
      <td>${g.phase}</td>
      <td>${g.label}</td>
      <td>${counts[g.id]}</td>
    </tr>`;
  }
  html += `<tr style="font-weight:600;border-top:2px solid #ccc"><td></td><td></td><td>Gesamt</td><td>${total}</td></tr>`;
  html += '</tbody>';
  el.innerHTML = html;
}

// ===================== SUBTRACTION =====================

const subGroups = [
  { id: 'sub0',      label: '−0 (Identität)',               color: '#9e9e9e', phase: 1 },
  { id: 'sub-nn',    label: 'n − n = 0',                    color: '#607d8b', phase: 1 },
  { id: 'sub1',      label: '−1 (eins zurück)',             color: '#78909c', phase: 2 },
  { id: 'sub-half',  label: 'Halbieren (aus Verdoppeln)',    color: '#e53935', phase: 3 },
  { id: 'sub-nhalf', label: 'Fast-Halbieren (±1)',          color: '#fb8c00', phase: 4 },
  { id: 'sub-from10',label: 'Vom Zehner (10 − x)',          color: '#7cb342', phase: 5 },
  { id: 'sub-count', label: '−2 / −3 (Rückwärts zählen)',   color: '#5c6bc0', phase: 6 },
  { id: 'sub-in10',  label: 'Minus bis 10 (Rest)',          color: '#29b6f6', phase: 7 },
  { id: 'sub-teen',  label: 'Im Zehner bleiben (>10)',      color: '#ec407a', phase: 8 },
  { id: 'sub-thru10',label: 'Über den Zehner zurück',       color: '#8e24aa', phase: 9 },
];

function classifySub(a, b) {
  // a - b where b <= a, both 0..20
  const c = a - b; // result
  if (b === 0)                         return 'sub0';       // n − 0 = n
  if (a === b)                         return 'sub-nn';     // n − n = 0
  if (b === 1)                         return 'sub1';       // n − 1
  if (c === b)                         return 'sub-half';   // halving: a = 2b
  if (Math.abs(c - b) === 1)           return 'sub-nhalf';  // near-halving: result ≈ subtrahend
  if (a === 10)                        return 'sub-from10'; // 10 − x
  if (b <= 3)                          return 'sub-count';  // count back 2 or 3
  if (a <= 10)                         return 'sub-in10';   // within 10, other
  if (c < 10 && a > 10)               return 'sub-thru10'; // crosses the ten boundary
  return 'sub-teen';                                        // stays above 10
}

{
  const el = document.getElementById('grid-sub');
  let html = '<div class="cell corner"></div>';
  // Header row: minuend a = 0..20
  for (let a = 0; a <= 20; a++) html += `<div class="cell header">${a}</div>`;
  // Rows: subtrahend b from 20 down to 0
  for (let b = 20; b >= 0; b--) {
    html += `<div class="cell header">${b}</div>`;
    for (let a = 0; a <= 20; a++) {
      if (b > a) {
        // Invalid: b > a → empty cell
        html += `<div class="cell empty"></div>`;
      } else {
        const g = classifySub(a, b);
        const c = a - b;
        html += `<div class="cell g-${g}" title="${a}−${b}=${c}">${a}−${b}</div>`;
      }
    }
  }
  el.innerHTML = html;
}

{
  const el = document.getElementById('legend-sub');
  const counts = {};
  for (const g of subGroups) counts[g.id] = 0;
  for (let a = 0; a <= 20; a++)
    for (let b = 0; b <= a; b++)
      counts[classifySub(a, b)]++;
  const total = Object.values(counts).reduce((s, n) => s + n, 0);

  let html = '<thead><tr><th></th><th>Phase</th><th>Strategie</th><th>Anzahl</th></tr></thead><tbody>';
  for (const g of subGroups) {
    html += `<tr>
      <td><span class="legend-swatch" style="background:${g.color}"></span></td>
      <td>${g.phase}</td>
      <td>${g.label}</td>
      <td>${counts[g.id]}</td>
    </tr>`;
  }
  html += `<tr style="font-weight:600;border-top:2px solid #ccc"><td></td><td></td><td>Gesamt</td><td>${total}</td></tr>`;
  html += '</tbody>';
  el.innerHTML = html;
}
</script>
</body>
</html>
